# Weekly update PRs; each one goes through the same CI before it can be merged.
version: 2
updates:
  # Actions are pinned by commit SHA; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A dependency goes to the first group it matches. Majors of packages that peer-depend on
    # each other come in one PR, so `npm ci` can resolve them together.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint']
        update-types: [major]
      vite:
        patterns: ['vite', '@vitejs/*']
        update-types: [major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
