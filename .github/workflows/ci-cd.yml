# CI for the MotoFlow frontend (React + Vite).
#
#   Pull request or push to main -> npm ci, lint, test, build
#
# Cloudflare Pages publishes the site. Connect the GitHub repo in the Pages project
# (production branch: main, build command: npm run build, output: dist).
# Set VITE_API_BASE_URL there to the backend origin plus /api/v1.
# This workflow does not deploy.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the Vite project is committed
        run: |
          if [ ! -f package.json ] || [ ! -f package-lock.json ]; then
            echo "::error::package.json and package-lock.json are missing."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (exactly as in package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build
